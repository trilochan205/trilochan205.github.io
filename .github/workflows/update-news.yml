name: Update Nepali news feeds
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-feed-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch publisher RSS feeds
        run: python scripts/update_news.py
      - name: Commit refreshed headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-affairs/news.json
          git diff --cached --quiet || (git commit -m "Auto-update Nepali news headlines" && git push)
