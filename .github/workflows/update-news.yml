name: Update Nepali news feeds
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update_news.py"
permissions:
  contents: write
concurrency:
  group: news-feed-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch publisher RSS feeds
        run: python scripts/update_news.py
      - name: Commit and safely push refreshed headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-affairs/news.json current-affairs/questions.json
          if git diff --cached --quiet; then
            echo "News feed has no changes."
            exit 0
          fi
          git commit -m "Auto-update news and Loksewa MCQ bank"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after fetch/rebase."
          done
          echo "Could not push news update after three attempts."
          exit 1
